# SPDX-License-Identifier: MIT OR Apache-2.0

[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.90"
version = "0.0.0"
authors = ["TPT Solutions"]
license = "MIT OR Apache-2.0"
publish = false
# repository: add once the remote URL is confirmed (todo: Phase 0 workspace item)

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
