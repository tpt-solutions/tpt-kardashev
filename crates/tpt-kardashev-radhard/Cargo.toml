# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "tpt-kardashev-radhard"
description = "Radiation-tolerant primitives: triple modular redundancy, SECDED, checksummed cells and checkpoints."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = []
alloc = []
# The one documented unsafe exception: volatile register access (spec 5.3).
volatile = []

[dependencies]

# Overrides the workspace `forbid(unsafe_code)` so the `volatile` module can use unsafe.
# The rest of the crate still contains no unsafe code; see src/lib.rs.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
