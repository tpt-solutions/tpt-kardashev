# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "tpt-kardashev-energy-ledger"
description = "Double-entry energy accounting with explicit waste heat, Landauer bounds and radiator capacity."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = []
alloc = []
serde = ["dep:serde"]

[dependencies]
# No `derive` feature: serde_derive pulls in a Unicode-3.0 dependency, which the licence policy denies.
serde = { version = "1.0.229", default-features = false, optional = true }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.152"
