[package]
name = "tpt-kardashev-reflect-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.tpt-kardashev-reflect]
path = ".."
features = ["alloc"]

[[bin]]
name = "text_read"
path = "fuzz_targets/text_read.rs"
test = false
doc = false
bench = false

# Separate workspace: the fuzzer is not part of the main workspace or its licence graph.
[workspace]
