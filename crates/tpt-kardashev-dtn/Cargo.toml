# SPDX-License-Identifier: MIT OR Apache-2.0

[package]
name = "tpt-kardashev-dtn"
description = "Delay-tolerant networking: BPv7 bundles, bundle stores, contact-graph routing and an LTP convergence layer."
readme = "README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["std"]
std = ["alloc"]
alloc = []
serde = ["dep:serde"]

[dependencies]
# No `derive` feature: serde_derive pulls in a Unicode-3.0 dependency, which the licence policy denies.
serde = { version = "1.0.229", default-features = false, features = ["alloc"], optional = true }

[lints]
workspace = true

[dev-dependencies]
serde_json = "1.0.152"
